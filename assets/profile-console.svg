<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 330" role="img" aria-labelledby="title desc">
  <title id="title">Ether — Void Runner</title>
  <desc id="desc">A dark terminal panel with cyan circuit traces, a violet processor grid, and neon pixel accents.</desc>
  <defs>
    <linearGradient id="panel" x2="1" y2="1" gradientUnits="objectBoundingBox">
      <stop stop-color="#101b2e"/>
      <stop offset=".53" stop-color="#090f1d"/>
      <stop offset="1" stop-color="#17112b"/>
    </linearGradient>
    <linearGradient id="edge">
      <stop stop-color="#6bf3ff"/>
      <stop offset=".55" stop-color="#6879ff"/>
      <stop offset="1" stop-color="#f371ce"/>
    </linearGradient>
    <linearGradient id="chip" x2="1" y2="1">
      <stop stop-color="#142c42"/>
      <stop offset="1" stop-color="#20183b"/>
    </linearGradient>
    <pattern id="dots" width="18" height="18" patternUnits="userSpaceOnUse">
      <circle cx="3" cy="3" r="1" fill="#b4ceff" opacity=".18"/>
    </pattern>
    <filter id="glow" x="-75%" y="-75%" width="250%" height="250%">
      <feGaussianBlur stdDeviation="3.5" result="soft"/>
      <feMerge>
        <feMergeNode in="soft"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Chassis and terminal header -->
  <path d="M26 4H934l22 22v278l-22 22H26L4 304V26z" fill="url(#panel)" stroke="#404d6d" stroke-width="2"/>
  <path d="M4 63h952M4 275h952" fill="none" stroke="#35445d"/>
  <path d="M26 4h211m468 322h229l22-22v-37" fill="none" stroke="url(#edge)" stroke-width="2"/>
  <path d="M19 37h6m-6 8h6m-6 8h6M935 74h6m-6 8h6m-6 8h6" stroke="#6bf3ff" opacity=".64"/>
  <g fill="#6bf3ff">
    <rect x="42" y="29" width="8" height="8"/>
    <rect x="55" y="29" width="8" height="8" opacity=".55"/>
    <rect x="68" y="29" width="8" height="8" opacity=".25"/>
  </g>
  <path d="M823 33h83m-50-7h50m-23 14h23" fill="none" stroke="#465775"/>
  <path d="M814 33h7" stroke="#f371ce" stroke-width="2"/>
  <text x="97" y="39" fill="#a7b8d3" font-family="monospace" font-size="17" letter-spacing="1">@lele-bulele</text>

  <!-- Identity -->
  <path d="M44 104v121" stroke="#334964" stroke-width="2"/>
  <path d="M44 104v27" stroke="#6bf3ff" stroke-width="2"/>
  <text x="65" y="162" fill="#f1f6ff" font-family="system-ui, sans-serif" font-size="76" font-weight="750" letter-spacing="-3">Ether</text>
  <text x="69" y="208" fill="#83e9fb" font-family="monospace" font-size="23" letter-spacing="1.8">VOID RUNNER</text>
  <path d="M69 237h247l12 12h116" fill="none" stroke="#344864"/>
  <path d="M69 237h55" stroke="#6879ff" stroke-width="2"/>

  <!-- Circuit traces and processor -->
  <rect x="474" y="77" width="457" height="183" fill="url(#dots)"/>
  <g fill="none" stroke-width="1.5">
    <path d="M480 111h63l22 22h65m-129 24h82l16 16h31m-124 33h56l18-18h50m-85 52h51l33-33" stroke="#45769b"/>
    <path d="M803 127h39l27-27h57m-123 49h75l24-24h24m-123 65h62l21 21h40m-123-2h31l30 30h62" stroke="#63588c"/>
    <path d="M480 111h63l22 22h65m173 57h62l21 21h40" stroke="url(#edge)" stroke-width="2"/>
    <path d="M667 92V78m26 14V78m26 14V78m26 14V78m26 14V78m-104 161v16m26-16v16m26-16v16m26-16v16m26-16v16" stroke="#566683"/>
  </g>
  <g fill="#0c1526" stroke="#79ddec" stroke-width="2">
    <circle cx="480" cy="111" r="4"/>
    <circle cx="501" cy="157" r="3"/>
    <circle cx="506" cy="206" r="3"/>
  </g>
  <g fill="#0c1526" stroke="#d77fd5" stroke-width="2">
    <circle cx="926" cy="100" r="3"/>
    <circle cx="926" cy="211" r="4"/>
    <circle cx="926" cy="239" r="3"/>
  </g>

  <path d="M642 92h149l12 12v123l-12 12H642l-12-12V104z" fill="url(#chip)" stroke="url(#edge)" stroke-width="2"/>
  <path d="M650 105h133l7 7v107l-7 7H650l-7-7V112z" fill="#11172a" stroke="#435774"/>
  <g fill="#263952">
    <rect x="661" y="119" width="18" height="18"/>
    <rect x="707" y="119" width="18" height="18"/>
    <rect x="753" y="119" width="18" height="18"/>
    <rect x="684" y="142" width="18" height="18"/>
    <rect x="730" y="142" width="18" height="18"/>
    <rect x="661" y="165" width="18" height="18"/>
    <rect x="707" y="165" width="18" height="18"/>
    <rect x="684" y="188" width="18" height="18"/>
    <rect x="730" y="188" width="18" height="18"/>
  </g>
  <g fill="#6bf3ff" filter="url(#glow)">
    <rect x="684" y="119" width="18" height="18"/>
    <rect x="707" y="142" width="18" height="18"/>
    <rect x="730" y="165" width="18" height="18"/>
    <rect x="753" y="188" width="18" height="18"/>
  </g>
  <g fill="#a88bff">
    <rect x="730" y="119" width="18" height="18"/>
    <rect x="661" y="142" width="18" height="18"/>
    <rect x="707" y="188" width="18" height="18"/>
  </g>
  <g fill="#f371ce">
    <rect x="753" y="142" width="18" height="18"/>
    <rect x="684" y="165" width="18" height="18"/>
  </g>
  <rect x="661" y="188" width="18" height="18" fill="#ffcf72"/>
  <rect x="753" y="165" width="18" height="18" fill="#497897"/>

  <!-- Footer -->
  <path d="m43 293 6 6-6 6m11 0h10" fill="none" stroke="#6bf3ff" stroke-width="2"/>
  <text x="78" y="305" fill="#c0cde1" font-family="monospace" font-size="18" letter-spacing="2.3">EVER ONWARD.</text>
  <path d="M687 299h145" stroke="#445373" stroke-dasharray="3 5"/>
  <path d="M844 299h72" stroke="url(#edge)" stroke-width="5" stroke-dasharray="7 6"/>
</svg>
